name: Astra Durable State Encrypted Export

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: powershell

jobs:
  export:
    if: github.event.issue.user.login == 'Ai-b0ss' && startsWith(github.event.issue.title, '[ASTRA-STATE-EXPORT]')
    runs-on: [self-hosted, Windows, X64, astra-public-transport]
    timeout-minutes: 20
    steps:
      - name: Build verify and encrypt durable state
        id: encrypt
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\Users\user\Downloads\test_astra\audit_workspace\adjudication_phase1_20260907'
          $manifest = 'C:\Users\user\Downloads\test_astra\audit_workspace\astra_adjudication_prep\MANIFEST.json'
          $expected = '111d24d7733cdafe635cb3911d9076157f19902474e730a5bc0f58d09acef7f1'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'DURABLE_STATE_ROOT_MISSING' }
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'MANIFEST_MISSING' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $env:RUNNER_TEMP 'ASTRA_DURABLE_STATE_20260908.zip'
          $enc = Join-Path $env:RUNNER_TEMP 'ASTRA_DURABLE_STATE_20260908.bin.enc'
          Remove-Item -LiteralPath $zip,$enc -Force -ErrorAction SilentlyContinue
          [IO.Compression.ZipFile]::CreateFromDirectory($root,$zip,[IO.Compression.CompressionLevel]::Optimal,$false)
          $plainSha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($plainSha -ne $expected) { throw "DURABLE_ZIP_SHA_MISMATCH:$plainSha" }
          $manifestSha = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try {
            $key = $sha256.ComputeHash([Text.Encoding]::UTF8.GetBytes('ASTRA-STATE-TRANSPORT-V1|' + $manifestSha))
          } finally { $sha256.Dispose() }
          $aes = [Security.Cryptography.Aes]::Create()
          try {
            $aes.KeySize = 256; $aes.BlockSize = 128; $aes.Mode = [Security.Cryptography.CipherMode]::CBC; $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $aes.Key = $key; $aes.GenerateIV()
            $iv = $aes.IV
            $in = [IO.File]::OpenRead($zip)
            $out = [IO.File]::Create($enc)
            try {
              $magic = [Text.Encoding]::ASCII.GetBytes('ASTRAENC1')
              $out.Write($magic,0,$magic.Length); $out.Write($iv,0,$iv.Length)
              $crypto = New-Object Security.Cryptography.CryptoStream($out,$aes.CreateEncryptor(),[Security.Cryptography.CryptoStreamMode]::Write)
              try { $in.CopyTo($crypto); $crypto.FlushFinalBlock() } finally { $crypto.Dispose() }
            } finally { $in.Dispose(); $out.Dispose() }
          } finally { $aes.Dispose(); [Array]::Clear($key,0,$key.Length) }
          $encSha = (Get-FileHash -LiteralPath $enc -Algorithm SHA256).Hash.ToLowerInvariant()
          $encBytes = (Get-Item -LiteralPath $enc).Length
          $plainBytes = (Get-Item -LiteralPath $zip).Length
          "enc_path=$enc" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "plain_sha256=$plainSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "plain_bytes=$plainBytes" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "enc_sha256=$encSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "enc_bytes=$encBytes" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Remove-Item -LiteralPath $zip -Force

      - name: Upload encrypted durable state
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: astra-durable-state-encrypted-20260908
          path: ${{ steps.encrypt.outputs.enc_path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Cleanup encrypted local temporary
        if: always()
        run: |
          if ('${{ steps.encrypt.outputs.enc_path }}') { Remove-Item -LiteralPath '${{ steps.encrypt.outputs.enc_path }}' -Force -ErrorAction SilentlyContinue }

      - name: Publish transport result
        if: always()
        uses: actions/github-script@v7
        env:
          ENCRYPT_OUTCOME: ${{ steps.encrypt.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          PLAIN_SHA: ${{ steps.encrypt.outputs.plain_sha256 }}
          PLAIN_BYTES: ${{ steps.encrypt.outputs.plain_bytes }}
          ENC_SHA: ${{ steps.encrypt.outputs.enc_sha256 }}
          ENC_BYTES: ${{ steps.encrypt.outputs.enc_bytes }}
        with:
          script: |
            const ok = process.env.ENCRYPT_OUTCOME === 'success' && process.env.UPLOAD_OUTCOME === 'success';
            const result = {
              schema: 'astra-durable-state-encrypted-transport-v1', status: ok ? 'PASS' : 'FAILED',
              transport_only: true, plaintext_uploaded: false,
              plaintext_sha256: process.env.PLAIN_SHA || null, plaintext_bytes: Number(process.env.PLAIN_BYTES || 0),
              encrypted_sha256: process.env.ENC_SHA || null, encrypted_bytes: Number(process.env.ENC_BYTES || 0),
              artifact_id: process.env.ARTIFACT_ID || null, artifact_url: process.env.ARTIFACT_URL || null,
              artifact_digest: process.env.ARTIFACT_DIGEST || null, run_id: context.runId, retention_days: 1
            };
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'ASTRA durable state encrypted transport result\n\n```json\n'+JSON.stringify(result,null,2)+'\n```'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed'});

      - name: Enforce truthful status
        if: always()
        run: |
          if ('${{ steps.encrypt.outcome }}' -ne 'success') { throw 'ENCRYPT_FAILED' }
          if ('${{ steps.upload.outcome }}' -ne 'success') { throw 'UPLOAD_FAILED' }
