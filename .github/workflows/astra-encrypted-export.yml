name: Astra Encrypted Evidence Export

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: powershell

jobs:
  export:
    if: github.event.issue.user.login == 'Ai-b0ss' && startsWith(github.event.issue.title, '[ASTRA-PUBLIC-EXPORT]')
    runs-on: [self-hosted, Windows, X64, astra-public-transport]
    timeout-minutes: 20
    steps:
      - name: Verify encrypted blob
        id: verify
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'C:\Users\user\Downloads\test_astra\audit_workspace\astra_transport_export_20260907\astra_phase1_evidence_20260907.tar.gz.enc'
          if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw 'ENCRYPTED_BLOB_MISSING' }
          $sha = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'd2733d280aa4f5f2b831ad1ae20aad2750407edce3fec13b69abffb53b7a65a0') { throw "ENCRYPTED_BLOB_SHA_MISMATCH:$sha" }
          $bytes = (Get-Item -LiteralPath $p).Length
          "blob_path=$p" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "blob_sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "blob_bytes=$bytes" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload encrypted evidence artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: astra-phase1-evidence-encrypted-20260907
          path: ${{ steps.verify.outputs.blob_path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish transport result
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          BLOB_SHA256: ${{ steps.verify.outputs.blob_sha256 }}
          BLOB_BYTES: ${{ steps.verify.outputs.blob_bytes }}
        with:
          script: |
            const ok = process.env.VERIFY_OUTCOME === 'success' && process.env.UPLOAD_OUTCOME === 'success';
            const result = {
              schema: 'astra-public-encrypted-transport-result-v1',
              status: ok ? 'PASS' : 'FAILED',
              transport_only: true,
              plaintext_uploaded: false,
              encrypted_blob_sha256: process.env.BLOB_SHA256 || null,
              encrypted_blob_bytes: Number(process.env.BLOB_BYTES || 0),
              artifact_id: process.env.ARTIFACT_ID || null,
              artifact_url: process.env.ARTIFACT_URL || null,
              artifact_digest: process.env.ARTIFACT_DIGEST || null,
              run_id: context.runId,
              retention_days: 1,
            };
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'ASTRA encrypted transport result\n\n```json\n' + JSON.stringify(result, null, 2) + '\n```'});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed'});

      - name: Enforce truthful status
        if: always()
        run: |
          if ('${{ steps.verify.outcome }}' -ne 'success') { throw 'VERIFY_FAILED' }
          if ('${{ steps.upload.outcome }}' -ne 'success') { throw 'UPLOAD_FAILED' }
