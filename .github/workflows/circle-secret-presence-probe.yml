name: Circle Secret Presence Probe

on:
  push:
    branches:
      - probe/circle-secret-presence-20260904
    paths:
      - '.github/workflows/circle-secret-presence-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CIRCLE_TOKEN: ${{ secrets.CIRCLE_TOKEN }}
      CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
      QWEN_WEBHOOK: ${{ secrets.QWEN_CIRCLE_CUSTOM_WEBHOOK_URL }}
      GENERIC_WEBHOOK: ${{ secrets.CIRCLE_CUSTOM_WEBHOOK_URL }}
      GPT_WEBHOOK: ${{ secrets.GPT_CIRCLE_CUSTOM_WEBHOOK_URL }}
      RUNTIME_KEY: ${{ secrets.RUNTIME_STATE_KEY }}
      AUTOPILOT_TOKEN_2: ${{ secrets.AUTOPILOT_GITHUB_TOKEN_2 }}
      HANDOFF_TOKEN: ${{ secrets.AUTOPILOT_HANDOFF_TOKEN }}
      CF_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GPT_SESSION: ${{ secrets.FF_CHATGPT_SESSION_BUNDLE }}
    steps:
      - name: Sanitized secret presence only
        shell: bash
        run: |
          set -euo pipefail
          set +x
          presence() {
            if [ -n "$2" ]; then echo "$1=PRESENT"; else echo "$1=ABSENT"; fi
          }
          presence CIRCLE_TOKEN "${CIRCLE_TOKEN:-}"
          presence CIRCLECI_TOKEN "${CIRCLECI_TOKEN:-}"
          presence QWEN_CIRCLE_CUSTOM_WEBHOOK_URL "${QWEN_WEBHOOK:-}"
          presence CIRCLE_CUSTOM_WEBHOOK_URL "${GENERIC_WEBHOOK:-}"
          presence GPT_CIRCLE_CUSTOM_WEBHOOK_URL "${GPT_WEBHOOK:-}"
          presence RUNTIME_STATE_KEY "${RUNTIME_KEY:-}"
          presence AUTOPILOT_GITHUB_TOKEN_2 "${AUTOPILOT_TOKEN_2:-}"
          presence AUTOPILOT_HANDOFF_TOKEN "${HANDOFF_TOKEN:-}"
          presence CLOUDFLARE_API_KEY "${CF_API_KEY:-}"
          presence CLOUDFLARE_EMAIL "${CF_EMAIL:-}"
          presence CLOUDFLARE_ACCOUNT_ID "${CF_ACCOUNT_ID:-}"
          presence FF_CHATGPT_SESSION_BUNDLE "${GPT_SESSION:-}"

      - name: Wake Qwen Circle project when webhook exists
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${QWEN_WEBHOOK:-}" ]; then
            echo QWEN_WAKE_SKIPPED_SECRET_ABSENT
            exit 0
          fi
          code=$(curl --silent --show-error --output /tmp/wake-body --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -H 'content-type: application/json' \
            -X POST "$QWEN_WEBHOOK" \
            --data '{"event_type":"free_fabric_task_ready","wake_intent_id":"owner-notion-preflight:g1","task_id":"owner-notion-preflight","generation":1,"selected_resource_id":"qwen","required_capabilities":["chat"]}')
          echo "QWEN_WAKE_HTTP=${code}"
          case "$code" in
            2??) echo QWEN_WAKE_ACCEPTED ;;
            *) echo QWEN_WAKE_REJECTED; exit 41 ;;
          esac
