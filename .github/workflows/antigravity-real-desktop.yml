name: Antigravity real Desktop QNIX patch and restore

on:
  push:
    branches:
      - test/antigravity-health-v3-windows-20261025
    paths:
      - .github/workflows/antigravity-real-desktop.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-patch-restore:
    runs-on: windows-latest
    timeout-minutes: 28
    steps:
      - name: Install official Antigravity Desktop 2.26.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'Antigravity-x64.exe'
          Invoke-WebRequest 'https://storage.googleapis.com/antigravity-public/antigravity-hub/2.26.0-6546645232517120/windows-x64/Antigravity-x64.exe' -OutFile $installer -TimeoutSec 160
          $sha=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '2444dfef9ff280b3c418399ff259c66684c98886bece26290484cf80c33756c9'){throw "OFFICIAL_INSTALLER_HASH_MISMATCH $sha"}
          Write-Host 'OFFICIAL_DESKTOP_INSTALLER_SHA256_PASS=true'
          $proc=Start-Process -FilePath $installer -ArgumentList '/S' -PassThru
          if(-not $proc.WaitForExit(180000)){& taskkill.exe /PID $proc.Id /T /F | Out-Null;throw 'Desktop installer timeout'}
          Write-Host "OFFICIAL_DESKTOP_INSTALLER_EXIT=$($proc.ExitCode)"
          if($proc.ExitCode -ne 0){throw 'Desktop installer failed'}
          $exe=Join-Path $env:LOCALAPPDATA 'Programs\antigravity\Antigravity.exe'
          $ls=Join-Path $env:LOCALAPPDATA 'Programs\antigravity\resources\bin\language_server.exe'
          if(-not (Test-Path $exe) -or -not (Test-Path $ls)){throw 'Installed Desktop EXE or language server missing'}
          Write-Host "DESKTOP_VERSION=$([Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion)"
          Write-Host "DESKTOP_SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash)"
          Write-Host "CLEAN_LANGUAGE_SERVER_SHA256=$((Get-FileHash $ls -Algorithm SHA256).Hash)"
          Write-Host 'OFFICIAL_DESKTOP_INSTALLED=true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact pinned and independently checked QNIX
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ref='90498f50353d414232f593dffe88899bc80b6312'
          $p=Join-Path $env:RUNNER_TEMP 'qnix-manager.py'
          Invoke-WebRequest "https://raw.githubusercontent.com/QNIX-Dev/eligibility-antigravity-patcher/$ref/manager.py" -OutFile $p -TimeoutSec 40
          $bytes=[IO.File]::ReadAllBytes($p)
          $head=[Text.Encoding]::ASCII.GetBytes("blob $($bytes.Length)" + [char]0)
          $blob=New-Object byte[] ($head.Length + $bytes.Length)
          [Array]::Copy($head,0,$blob,0,$head.Length)
          [Array]::Copy($bytes,0,$blob,$head.Length,$bytes.Length)
          $sha1=[BitConverter]::ToString(([Security.Cryptography.SHA1]::Create()).ComputeHash($blob)).Replace('-','').ToLowerInvariant()
          if($sha1 -ne '99c61225c78ba3b66eca71fb0c0e278d1bf0bf27'){throw "QNIX_SOURCE_HASH_MISMATCH $sha1"}
          Write-Host 'QNIX_PINNED_SOURCE_VERIFIED=true'
      - name: Apply real manager patch and restore
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:RUNNER_TEMP 'qnix-manager.py'
          $ls=Join-Path $env:LOCALAPPDATA 'Programs\antigravity\resources\bin\language_server.exe'
          $backup=Join-Path $env:RUNNER_TEMP 'clean-language_server.exe'
          Copy-Item -LiteralPath $ls -Destination $backup
          $h0=(Get-FileHash $ls -Algorithm SHA256).Hash
          & python $p status manager --path-manager $ls
          if($LASTEXITCODE -ne 0){throw 'INITIAL_LANGUAGE_SERVER_STATUS_FAILED'}
          & python $p patch manager --path-manager $ls
          Write-Host "DESKTOP_QNIX_PATCH_EXIT=$LASTEXITCODE"
          if($LASTEXITCODE -ne 0){throw 'DESKTOP_QNIX_PATCH_FAILED'}
          & python $p status manager --path-manager $ls
          if($LASTEXITCODE -ne 0){throw 'DESKTOP_QNIX_POST_STATUS_FAILED'}
          $h1=(Get-FileHash $ls -Algorithm SHA256).Hash
          if($h1 -eq $h0){throw 'DESKTOP_PATCH_LEFT_FILE_UNCHANGED'}
          Write-Host "PATCHED_LANGUAGE_SERVER_SHA256=$h1"
          Write-Host 'REAL_DESKTOP_LANGUAGE_SERVER_PATCH_VERIFIED=true'
          & python $p restore manager --path-manager $ls
          if($LASTEXITCODE -ne 0){throw 'DESKTOP_RESTORE_FAILED'}
          & python $p status manager --path-manager $ls
          if($LASTEXITCODE -ne 0){throw 'DESKTOP_RESTORED_STATUS_FAILED'}
          $h2=(Get-FileHash $ls -Algorithm SHA256).Hash
          if($h2 -ne $h0){throw "DESKTOP_RESTORE_HASH_MISMATCH $h2 != $h0"}
          Write-Host "RESTORED_LANGUAGE_SERVER_SHA256=$h2"
          Write-Host 'REAL_DESKTOP_PATCH_AND_RESTORE_PASS=true'
