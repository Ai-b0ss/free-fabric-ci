name: Free Fabric CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run public regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  release-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build reproducibility proof
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -c "import json; from pathlib import Path; from desktop.build_release import selftest; Path('release-proof.json').write_text(json.dumps(selftest(), sort_keys=True) + '\n', encoding='utf-8')"
      - name: Upload reproducibility proof
        uses: actions/upload-artifact@v4
        with:
          name: release-proof-${{ runner.os }}
          path: release-proof.json
          if-no-files-found: error
          retention-days: 7

  cross-os-release-proof:
    needs: release-proof
    runs-on: ubuntu-latest
    steps:
      - name: Download OS proofs
        uses: actions/download-artifact@v4
        with:
          pattern: release-proof-*
          path: proofs
      - name: Require identical Ubuntu and Windows release digests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = {
              "Linux": Path("proofs/release-proof-Linux/release-proof.json"),
              "Windows": Path("proofs/release-proof-Windows/release-proof.json"),
          }
          proofs = {name: json.loads(path.read_text(encoding="utf-8")) for name, path in paths.items()}
          for name, proof in proofs.items():
              if proof.get("selftest") is not True:
                  raise SystemExit(f"{name}: selftest did not pass")
              if proof.get("unsafe_paths_rejected") != 4:
                  raise SystemExit(f"{name}: unsafe path rejection count mismatch")
              digest = proof.get("sha256")
              if not isinstance(digest, str) or len(digest) != 64 or any(c not in "0123456789abcdef" for c in digest):
                  raise SystemExit(f"{name}: invalid sha256 proof")
          if proofs["Linux"]["sha256"] != proofs["Windows"]["sha256"]:
              raise SystemExit("cross-OS release digest mismatch")
          print(json.dumps({"cross_os_reproducible": True, "sha256": proofs["Linux"]["sha256"]}, sort_keys=True))
          PY
