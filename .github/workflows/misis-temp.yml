name: temp-misis-schedule-fetch

on:
  pull_request:
    branches: [main]

jobs:
  fetch-and-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download current official MISIS schedule
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 --connect-timeout 20 \
            -A 'Mozilla/5.0' \
            -e 'https://misis.ru/students/schedule/' \
            'https://misis.ru/files/-/0d429d470d57f677a7770fd4afe00df8/itkn-040926.xls' \
            -o itkn-040926.xls
          file itkn-040926.xls
          test "$(stat -c%s itkn-040926.xls)" -gt 10000

      - name: Install parser
        shell: bash
        run: |
          git clone -q https://github.com/superuser547/MISIS-Schedule.git parser_repo
          python -m pip install --disable-pip-version-check -r parser_repo/requirements.txt

      - name: Parse BBI-26-6-2
        shell: bash
        run: |
          cat > parse_misis.py <<'PY'
          import json, sys
          sys.path.insert(0, 'parser_repo')
          from misis_schedule.parser import get_sheet_names, read_sheet, get_groups, available_subgroups, parse_schedule

          path='itkn-040926.xls'
          group='ББИ-26-6-2'
          result={'source': path, 'group': group, 'sheet_names': get_sheet_names(path), 'matches': []}
          for sheet_name in result['sheet_names']:
              try:
                  sheet=read_sheet(path, sheet_name)
                  groups=get_groups(sheet)
              except Exception:
                  continue
              if group not in groups:
                  continue
              subgroups=available_subgroups(sheet, group)
              match={'sheet': sheet_name, 'subgroups': subgroups, 'lessons_by_subgroup': {}}
              for subgroup in subgroups:
                  lessons=parse_schedule(sheet, group, subgroup)
                  rows=[]
                  for x in lessons:
                      rows.append({
                          'weekday': x.weekday,
                          'pair_number': x.pair_number,
                          'start_time': x.start_time.isoformat(timespec='minutes'),
                          'end_time': x.end_time.isoformat(timespec='minutes'),
                          'week_type': getattr(x.week_type, 'value', str(x.week_type)),
                          'subject': x.subject,
                          'location': x.location,
                          'subgroup': x.subgroup_number,
                      })
                  match['lessons_by_subgroup'][str(subgroup)]=rows
              result['matches'].append(match)
          with open('BBI-26-6-2_itkn-040926.json','w',encoding='utf-8') as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if not result['matches']:
              raise SystemExit('group not found')
          PY
          python parse_misis.py | tee parsed_output.txt

      - name: Upload parsed result
        uses: actions/upload-artifact@v4
        with:
          name: misis-itkn-040926-bbi-26-6-2
          path: |
            itkn-040926.xls
            BBI-26-6-2_itkn-040926.json
            parsed_output.txt
          retention-days: 1
